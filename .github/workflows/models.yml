name: Build model assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run fetch:model
      - run: bun run fetch:mt
      - run: bun run verify:models --bundled
      - uses: actions/upload-artifact@v4
        with:
          name: english-russian-models
          path: src-tauri/assets/models
          if-no-files-found: error
          compression-level: 0
