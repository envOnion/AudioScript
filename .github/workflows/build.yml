name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    name: Prepare English and Russian models
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/asr-builtin
            src-tauri/assets/models/mt/opus-mt-en-ru-ct2
            src-tauri/assets/models/mt/opus-mt-ru-en-ct2
            .cache/mt-hf
            ~/.cache/huggingface
          key: ru-models-v1-${{ hashFiles('scripts/fetch-model.mjs', 'scripts/fetch-mt-model.mjs', 'src-tauri/assets/model-catalog.json') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: node --test scripts/release-assets.test.mjs
      - run: bunx biome check src/
      - run: bun run fetch:model
      - run: bun run fetch:mt
      - run: node scripts/fetch-canary.mjs
      - run: bun run verify:models --bundled
      - run: node scripts/check-localization.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-models
          path: |
            src-tauri/assets/models/asr-builtin
            src-tauri/assets/models/mt/opus-mt-en-ru-ct2
            src-tauri/assets/models/mt/opus-mt-ru-en-ct2
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: asr-canary
          path: .cache/asr-canary
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build ${{ matrix.platform }}
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macOS-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: Windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: Ubuntu-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo python3 -c 'from pathlib import Path; paths = [Path("/etc/apt/sources.list"), *Path("/etc/apt/sources.list.d").glob("*.sources")]; [p.write_text(p.read_text().replace("http://azure.archive.ubuntu.com/ubuntu", "https://archive.ubuntu.com/ubuntu")) for p in paths if p.is_file()]'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev build-essential libxdo-dev libpipewire-0.3-dev cmake ninja-build
          echo 'CXXFLAGS=-D_GLIBCXX_USE_CXX11_ABI=0' >> "$GITHUB_ENV"
      - name: Windows static CRT
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: ru-v1-${{ matrix.target }}-cxx-abi-0
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: bundled-models
          path: src-tauri/assets/models
      - uses: actions/download-artifact@v4
        with:
          name: asr-canary
          path: .cache/asr-canary
      - name: Validate and test
        run: |
          bun run typecheck
          bun run build
          bun run verify:models --bundled
          cargo test --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }} --locked
          cargo test --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }} --locked bundled_ -- --ignored --nocapture --test-threads=1
      - name: Build signed update artifacts and installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
          else
            bun tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          fi
      - name: Stage release files
        run: node scripts/stage-release.mjs ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: .cache/release-assets/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Stage draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify files and make signed updater manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/prepare-release.mjs release-assets --allow-unsigned
      - name: Create draft for final asset verification
        uses: softprops/action-gh-release@v2
        with:
          name: AudioScript ${{ github.ref_name }} — английский ↔ русский
          draft: true
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: release-assets/*
